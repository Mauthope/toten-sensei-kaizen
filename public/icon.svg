<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="230" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.3" fill="none" />

  <!-- Sensei Head -->
  <circle cx="256" cy="220" r="110" fill="#fed7aa" />
  
  <!-- Kimono / Robe -->
  <path d="M 120 480 Q 256 360 392 480 Z" fill="#0f172a" stroke="#06b6d4" stroke-width="8" />
  <path d="M 210 390 L 256 460 L 302 390" stroke="#3b82f6" stroke-width="6" fill="none" />

  <!-- White Eyebrows & Beard (Sensei aesthetic) -->
  <!-- Headband with Japanese Kaizen symbol / Red Sun -->
  <path d="M 150 170 Q 256 150 362 170 L 362 135 Q 256 120 150 135 Z" fill="#ef4444" />
  <circle cx="256" cy="148" r="14" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M 180 185 Q 215 170 235 190" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M 332 185 Q 297 170 277 190" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" />

  <!-- Sensei Beard / Mustache -->
  <path d="M 210 260 Q 256 285 302 260 Q 275 325 256 330 Q 237 325 210 260 Z" fill="#ffffff" />

  <!-- Binoculars in Hand -->
  <g filter="url(#glow)">
    <rect x="175" y="195" width="65" height="48" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="4" />
    <circle cx="207" cy="219" r="18" fill="#0ea5e9" stroke="#e0f2fe" stroke-width="3" />
    
    <rect x="272" y="195" width="65" height="48" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="4" />
    <circle cx="305" cy="219" r="18" fill="#0ea5e9" stroke="#e0f2fe" stroke-width="3" />
    
    <!-- Bridge -->
    <rect x="240" y="212" width="32" height="12" rx="4" fill="#1e293b" />
  </g>
</svg>
